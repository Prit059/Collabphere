<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Qpay Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #ff7e5f, #feb47b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-2">Sign up to CollabSphere</h2>
        <p class="text-center text-gray-600 mb-6">Quick & Simple way to Automate your payment</p>
        <form id="signup-form" class="space-y-4" onsubmit="return validateSignUp()">
            <div>
                <input id="first-name" class="w-full border border-gray-400 p-2 rounded" placeholder="FIRST NAME"
                    type="text" />
                <span id="first-name-error" class="text-red-500 text-sm hidden">Please enter your first name.</span>
            </div>
            <div>
                <input id="email" class="w-full border border-gray-400 p-2 rounded" placeholder="EMAIL ADDRESS"
                    type="email" />
                <span id="email-error" class="text-red-500 text-sm hidden">Please enter a valid email address.</span>
            </div>
            <div class="relative">
                <input id="password" class="w-full border border-gray-400 p-2 rounded" placeholder="PASSWORD"
                    type="password" />
                <i class="fas fa-eye absolute right-3 top-3 text-gray-500 cursor-pointer"
                    onclick="togglePasswordVisibility()"></i>
                <span id="password-error" class="text-red-500 text-sm hidden">Please enter a password.</span>
            </div>
            <div class="flex items-center">
                <input class="mr-2" id="terms" type="checkbox" required />
                <label class="text-gray-600 text-sm" for="terms">I agree to the Terms of Service and Privacy
                    Policy</label>
            </div>
            <button class="w-full bg-black text-white py-2 rounded" type="submit">CREATE AN ACCOUNT</button>
        </form>
        <div class="text-center my-4 text-gray-600">OR</div>
        
            <div class="flex justify-center space-x-4">
                <a href="https://accounts.google.com/o/oauth2/auth?client_id=YOUR_GOOGLE_CLIENT_ID&redirect_uri=YOUR_REDIRECT_URI&scope=profile email&response_type=code">
                    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        Sign in with Google
                    </button>
                </a>
            </div>
        
        <div class="text-center mt-4">
            <a href="signin.html" class="text-blue-500">Already have an account? Sign in</a>
        </div>
    </div>
    <footer class="absolute bottom-4 text-center w-full text-gray-600 text-sm">
        © 2021 - 2025 All Rights Reserved. Qpay.
    </footer>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
            // Toggle the eye icon
            const eyeIcon = document.querySelector(".fa-eye");
            eyeIcon.classList.toggle("fa-eye-slash");
        }


        function validateSignUp() {
            let isValid = true;

            // Reset error messages
            document.querySelectorAll('.text-red-500').forEach(el => el.classList.add('hidden'));

            // First Name validation
            const firstName = document.getElementById('first-name').value.trim();
            if (firstName === '') {
                document.getElementById('first-name-error').classList.remove('hidden');
                isValid = false;
            }

            // Email validation
            const email = document.getElementById('email').value.trim();
            if (!isValidEmail(email)) {
                document.getElementById('email-error').classList.remove('hidden');
                isValid = false;
            }

            // Password validation
            const password = document.getElementById('password').value.trim();
            if (password === '') {
                document.getElementById('password-error').classList.remove('hidden');
                isValid = false;
            }

            if (isValid) {
                // Store data in local storage
                const userData = {
                    firstName: firstName,
                    email: email,
                    password: password
                };
                localStorage.setItem('userData', JSON.stringify(userData));

                // Redirect to sign-in page
                window.location.href = 'signin.html';
                return false; // Prevent the form from actually submitting
            }

            return false; // Prevent form submission if validation fails
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
    </script>
</body>

</html>
